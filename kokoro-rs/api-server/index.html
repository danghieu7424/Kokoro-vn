<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kokoro TTS Client</title>
    <style>
        /* Reset & Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f8fafc;
            padding: 1rem;
        }

        /* Glassmorphism Container */
        .glass-card {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            border-radius: 1rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        textarea,
        select,
        input[type="range"] {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 0.5rem;
            color: #f8fafc;
            padding: 0.75rem;
            outline: none;
            font-size: 0.9rem;
        }

        textarea:focus,
        select:focus {
            border-color: #38bdf8;
        }

        button {
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: none;
            background: #0284c7;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover:not(:disabled) {
            background: #0369a1;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        audio {
            width: 100%;
            margin-top: 0.5rem;
        }

        .status {
            font-size: 0.85rem;
            text-align: center;
            min-height: 1.25rem;
            color: #38bdf8;
        }
    </style>
</head>

<body>

    <div class="glass-card">
        <h2>Kokoro TTS Web Client</h2>

        <div class="form-group">
            <label for="textInput">Văn bản</label>
            <textarea id="textInput" rows="4" placeholder="Nhập văn bản cần đọc..."></textarea>
        </div>

        <div class="form-group">
            <label for="voiceSelect">Giọng đọc</label>
            <select id="voiceSelect">
                <option value="diem_trinh">diem_trinh</option>
            </select>
        </div>

        <div class="form-group">
            <label for="speedInput">Tốc độ: <span id="speedVal">1.0</span>x</label>
            <input type="range" id="speedInput" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>

        <button id="submitBtn">Tạo & Phát âm thanh</button>
        <div id="status" class="status"></div>

        <audio id="audioPlayer" controls style="display: none;"></audio>
    </div>

    <script>
        const API_BASE = "/api";
        const submitBtn = document.getElementById("submitBtn");
        const textInput = document.getElementById("textInput");
        const voiceSelect = document.getElementById("voiceSelect");
        const speedInput = document.getElementById("speedInput");
        const speedVal = document.getElementById("speedVal");
        const statusDiv = document.getElementById("status");
        const audioPlayer = document.getElementById("audioPlayer");

        // Đồng bộ hiển thị thanh trượt tốc độ
        speedInput.addEventListener("input", (e) => {
            speedVal.textContent = e.target.value;
        });

        // Tải danh sách giọng đọc từ server
        async function loadVoices() {
            try {
                const res = await fetch(`${API_BASE}/voices`);
                if (!res.ok) return;
                const voices = await res.json();
                voiceSelect.innerHTML = voices
                    .map(v => `<option value="${v.id}">${v.label} (${v.gender})</option>`)
                    .join("");
            } catch (err) {
                statusDiv.textContent = "Không tải được danh sách giọng đọc.";
            }
        }

        // Gửi yêu cầu phát âm
        submitBtn.addEventListener("click", async () => {
            const text = textInput.value.trim();
            if (!text) {
                statusDiv.textContent = "Vui lòng nhập văn bản.";
                return;
            }

            submitBtn.disabled = true;
            statusDiv.textContent = "Đang xử lý âm thanh...";

            try {
                const res = await fetch(`${API_BASE}/tts`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        text: text,
                        voice: voiceSelect.value,
                        speed: parseFloat(speedInput.value)
                    })
                });

                if (!res.ok) {
                    throw new Error(`HTTP Error: ${res.status}`);
                }

                const blob = await res.blob();
                const audioUrl = URL.createObjectURL(blob);

                audioPlayer.src = audioUrl;
                audioPlayer.style.display = "block";
                audioPlayer.play();
                statusDiv.textContent = "Hoàn tất.";
            } catch (err) {
                statusDiv.textContent = "Xảy ra lỗi khi gửi yêu cầu.";
            } finally {
                submitBtn.disabled = false;
            }
        });

        loadVoices();
    </script>
</body>

</html>
